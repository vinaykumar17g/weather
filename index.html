<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherWise - Your Daily Forecast</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #282c34; /* Dark background */
            --card-bg: #3c424a; /* Slightly lighter card background */
            --text-color: #ffffff; /* White text */
            --accent-color: #61dafb; /* Cyan blue for accents */
            --input-bg: #4a5058; /* Darker input background */
            --border-radius: 12px;
            --box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- Loader Styles --- */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: fixed; /* Keep it centered even if content scrolls */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--primary-bg);
            z-index: 1000; /* Ensure it's on top */
        }

        #loader {
            height: 80px;
            width: 80px;
            border: 8px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            border-top-color: transparent;
            border-bottom-color: transparent;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 20px;
            font-size: 1.8em;
            font-weight: 600;
            color: var(--text-color);
        }

        .owner-text {
            background: linear-gradient(to right, #ff6b6b, #4ecdc4, #4a90e2); /* More vibrant gradient */
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.2em;
            font-weight: 500;
            margin-top: 10px;
        }

        /* --- Main Container Styles --- */
        #container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 400px; /* Limit width for a cleaner look */
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
            opacity: 0; /* Hidden by default for smooth transition */
            transform: translateY(20px); /* Slightly move down for animation */
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }

        #container.show {
            opacity: 1;
            transform: translateY(0);
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 15px;
            font-size: 2em;
            font-weight: 700;
        }

        hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin: 20px 0;
        }

        /* --- Search Input Styles --- */
        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border-radius: 30px; /* More rounded */
            padding: 8px 15px;
            margin-bottom: 30px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .search-box input[type="text"] {
            flex-grow: 1;
            background-color: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 1em;
            padding: 5px 10px;
        }

        .search-box input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .search-box button { /* Changed submit to button for better semantic and styling control */
            background-color: var(--accent-color);
            border: none;
            border-radius: 50%; /* Circular button */
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .search-box button:hover {
            background-color: #4ac9ea;
        }

        .search-box button img { /* Icon for search button */
            width: 20px;
            height: 20px;
            filter: invert(1); /* Make the icon white */
        }

        /* --- Weather Display Styles --- */
        .weather-display {
            margin-bottom: 30px;
        }

        .weather-display img {
            height: 80px; /* Larger icon */
            margin-bottom: 15px;
        }

        .weather-display .weather {
            font-size: 1.5em;
            font-weight: 500;
            margin-bottom: 5px;
            color: rgba(255, 255, 255, 0.8);
        }

        .weather-display .temp {
            font-size: 3.5em; /* Larger temperature */
            font-weight: 700;
            margin-bottom: 10px;
        }

        .weather-display .city {
            font-size: 1.8em;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* --- Details Section Styles --- */
        .details-container {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .detail-box {
            background-color: var(--input-bg);
            border-radius: var(--border-radius);
            padding: 15px;
            width: 45%;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .detail-box p {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--accent-color);
        }

        .detail-box h3 {
            font-size: 0.9em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
        }

        /* --- Utility Classes --- */
        .hide {
            display: none !important;
        }

        /* --- Media Queries for Responsiveness --- */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            #container {
                padding: 20px;
            }

            .weather-display .temp {
                font-size: 3em;
            }

            .weather-display .city {
                font-size: 1.5em;
            }

            .details-container {
                flex-direction: column;
                gap: 15px;
            }

            .detail-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div id="loader"></div><br>
        <h1 class="loader-text">Fetching Weather...</h1>
        <p class="owner-text"><i>Created By Vinay Kumar ❤️</i></p>
    </div>

    <div id="container" class="hide">
        <h1>WeatherWise</h1>
        <hr>

        <div class="search-box">
            <input type="text" id="text" placeholder="Enter city name">
            <button id="submit">
                <img src="search_icon.png" alt="Search"> </button>
        </div>
        
        <div class="weather-display">
            <img src="clear.png" alt="Weather Icon" class="weather-icon">
            <h3 class="weather">Clear</h3>
            <h1 class="temp">22°C</h1>
            <h2 class="city">NEWYORK</h2>
        </div>
        
        <div class="details-container">
            <div class="detail-box">
                <p class="humidity">50%</p> <h3>HUMIDITY</h3>
            </div>
            <div class="detail-box">
                <p class="wind">10 km/h</p>
                <h3>WIND SPEED</h3> </div>
        </div>
        <p class="owner-text" style="margin-top: 30px;"><i>Created By Vinay Kumar ❤️</i></p>
    </div>

    <script>
        let container = document.querySelector("#container");
        let loaderContainer = document.querySelector(".loader-container");

        // Simulate loading time and then display the app
        window.addEventListener('load', () => {
            setTimeout(() => {
                loaderContainer.classList.add('hide');
                container.classList.remove('hide');
                container.classList.add('show'); // Add 'show' class for animation
            }, 2000); // 2 seconds delay
        });

        const cityInput = document.getElementById("text");
        const submitBtn = document.getElementById("submit");
        const weatherIcon = document.querySelector(".weather-icon");
        const temperatureDisplay = document.querySelector(".temp");
        const cityDisplay = document.querySelector(".city");
        const humidityDisplay = document.querySelector(".humidity");
        const windDisplay = document.querySelector(".wind");
        const weatherConditionDisplay = document.querySelector(".weather");

        const apiUrl = "https://api.openweathermap.org/data/2.5/weather?&units=metric&q=";
        const apiKey = "e0e884b82ced4f49351ca81425d69417"; // Your API Key

        async function checkWeather(city) {
            if (!city) {
                alert("Please enter a city name.");
                return;
            }

            try {
                const response = await fetch(`${apiUrl}${city}&appid=${apiKey}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                console.log(data);

                if (data.cod === '404') { // Handle city not found error
                    alert("City not found. Please try again.");
                    return;
                }

                temperatureDisplay.innerText = Math.round(data.main.temp) + "°C";
                cityDisplay.innerText = data.name.toUpperCase();
                humidityDisplay.innerText = data.main.humidity + "%"; // Added percentage
                windDisplay.innerText = Math.round(data.wind.speed) + " km/h";
                weatherConditionDisplay.innerText = data.weather[0].main;

                // Update weather icon based on condition
                const weatherMain = data.weather[0].main.toLowerCase();
                if (weatherMain === "clear") {
                    weatherIcon.src = "clear.png";
                } else if (weatherMain === "rain") {
                    weatherIcon.src = "rain.png";
                } else if (weatherMain === "clouds") {
                    weatherIcon.src = "clouds.png";
                } else if (weatherMain === "drizzle") {
                    weatherIcon.src = "drizzle.png";
                } else if (weatherMain === "mist" || weatherMain === "haze") {
                    weatherIcon.src = "mist.png";
                } else {
                    weatherIcon.src = "clouds.png"; // Default to clouds
                }
            } catch (error) {
                console.error("Error fetching weather data:", error);
                alert("Could not retrieve weather data. Please check your internet connection or the city name.");
            }
        }

        submitBtn.addEventListener("click", () => {
            checkWeather(cityInput.value);
        });

        cityInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                checkWeather(cityInput.value);
            }
        });

        // Initial weather fetch for a default city (e.g., London)
        checkWeather("London");
    </script>
</body>
</html>
